name: scan-secrets

# Repo-wide leak guard. Runs on EVERY push and PR with no path filter — any file can
# leak, so every change is scanned. Catches the class of incident that has already bitten
# this repo (real CTF flag values, home-path username leaks, credential tokens). Stdlib
# Python only — no dependencies, no network.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked files for leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for leaked secrets / flags / paths
        run: python3 scripts/scan_secrets.py
