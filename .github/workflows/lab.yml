name: lab

# Deterministic proof gate: every exploit class in lab/ must re-run and pass its
# gate, with no model and no API key. This is what "[CONFIRMED]" means — re-runnable,
# not "the model said so". Runs on PRs and pushes to main. Stdlib Python only.

on:
  pull_request:
    paths:
      - "lab/**"
      - "engine/**"
      - "redteam/**"
      - ".github/workflows/lab.yml"
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "engine/**"
      - "redteam/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Run exploit gates + harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine gate self-check
        run: python3 engine/gates.py

      - name: Detection-arm regression tests
        run: cd engine && python3 test_arms.py

      - name: Run the lab (24/24 exploit gates)
        run: python3 lab/run_lab.py

      - name: Adaptive red-team harness regression
        run: python3 redteam/test_redteam.py
