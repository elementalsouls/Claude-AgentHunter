name: ✨ New skill proposal
description: Propose a new hunt-agent-* or capability skill. Open this BEFORE writing the SKILL.md (per CONTRIBUTING.md).
title: "[skill] hunt-agent-<name> — <one-line purpose>"
labels: ["skill-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Per CONTRIBUTING.md, propose new skills here first so we can confirm scope and avoid overlap before you write the full SKILL.md.
  - type: input
    id: name
    attributes:
      label: Proposed skill name
      description: lowercase-hyphen only, e.g. hunt-agent-vector-store-poisoning
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What gap does it fill?
      description: What can't be done well with the existing 23 hunt-agent skills? Be specific.
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Overlap check
      description: Which existing skills are closest, and why is this distinct enough to stand alone?
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Runnable Probe + LETHAL WHEN
      description: Every skill carries a stdlib-only Runnable Probe and a `# LETHAL WHEN:` line tying output to a gate. Sketch both.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source material
      description: Disclosed reports, CVEs, papers, or benchmarks this would be built/validated from (links preferred — the house style cites primary sources in `sources:` / `validated_against:`).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This targets AI-agent attack surface (LLM agents, MCP, RAG, tool-calling, multi-agent) — not generic web/infra classes that already live in sibling bundles.
          required: true
        - label: It contains no real client/engagement identifiers, credentials, or target-specific exploits — all class-based / anonymized.
          required: true
