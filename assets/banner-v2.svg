<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800" role="img" aria-label="Claude-AgentHunter - cross-harness Agent Skills for red-teaming LLM agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="58%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#0c1117"/>
    </linearGradient>
    <radialGradient id="hot" cx="20%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#ff2d4f" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#ff2d4f" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff2d4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="82%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#202230" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,"JetBrains Mono","IBM Plex Mono","SF Mono",Menlo,monospace}
      .muted{fill:#9a9aa8}
      .dim{fill:#5f6070}
      .white{fill:#f7f7fb}
      .red{fill:#ff2d4f}
      .cyan{fill:#4cc9f0}
      .amber{fill:#f6b44b}
    </style>
  </defs>

  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>
  <rect width="1920" height="800" fill="url(#hot)"/>
  <rect width="1920" height="800" fill="url(#cool)"/>

  <!-- meta row -->
  <g class="mono" font-size="12" letter-spacing="2.2">
    <text x="80" y="52" class="dim">CLAUDE-AGENTHUNTER / MAIN / CROSS-HARNESS AGENT SKILLS</text>
    <text x="1840" y="52" text-anchor="end" class="muted">github.com/elementalsouls/Claude-AgentHunter</text>
  </g>
  <line x1="80" y1="72" x2="1840" y2="72" stroke="#1d1f2b"/>

  <!-- logo mark : reticle + agent-tool graph, 150px -->
  <g transform="translate(80 172) scale(1.5)" filter="url(#glow)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#ff2d4f" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="31" fill="none" stroke="#ff2d4f" stroke-width="1" opacity="0.35" stroke-dasharray="3 5"/>
    <g stroke="#ff2d4f" stroke-width="3" stroke-linecap="round">
      <line x1="50" y1="1" x2="50" y2="15"/>
      <line x1="50" y1="85" x2="50" y2="99"/>
      <line x1="1" y1="50" x2="15" y2="50"/>
      <line x1="85" y1="50" x2="99" y2="50"/>
    </g>
    <!-- agent → tool edges -->
    <g stroke="#4cc9f0" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round">
      <line x1="50" y1="50" x2="32" y2="37"/>
      <line x1="50" y1="50" x2="69" y2="41"/>
      <line x1="50" y1="50" x2="64" y2="67"/>
      <line x1="50" y1="50" x2="35" y2="66"/>
    </g>
    <!-- tool nodes -->
    <g fill="#f6b44b">
      <circle cx="32" cy="37" r="4.5"/>
      <circle cx="69" cy="41" r="4.5"/>
      <circle cx="64" cy="67" r="4.5"/>
      <circle cx="35" cy="66" r="4.5"/>
    </g>
    <!-- agent core -->
    <circle cx="50" cy="50" r="8" fill="#4cc9f0"/>
    <circle cx="50" cy="50" r="8" fill="none" stroke="#0a0a10" stroke-width="1.4"/>
  </g>

  <!-- title lockup -->
  <g class="sans" font-weight="800">
    <text x="290" y="262" font-size="116" letter-spacing="-2" class="white" textLength="380" lengthAdjust="spacingAndGlyphs">claude</text>
    <text x="716" y="262" font-size="116" font-weight="300" class="dim">/</text>
    <text x="782" y="262" font-size="116" letter-spacing="-2" class="red" filter="url(#glow)" textLength="600" lengthAdjust="spacingAndGlyphs">hunt-agent</text>
  </g>
  <line x1="784" y1="296" x2="1384" y2="296" stroke="#ff2d4f" stroke-width="3"/>

  <!-- feature chips -->
  <g class="mono" font-size="14" font-weight="700" letter-spacing="2.4">
    <text x="290" y="336" class="white"><tspan class="red">+ </tspan>AGENT TOOL EXPLOITATION</text>
    <text x="700" y="336" class="white"><tspan class="red">+ </tspan>MCP / A2A ATTACKS</text>
    <text x="1030" y="336" class="white"><tspan class="red">+ </tspan>RUNNABLE PROBES</text>
  </g>
  <text x="290" y="384" class="mono muted" font-size="19" letter-spacing="0.2">23 skills for red-teaming LLM agents - chatbots, RAG, tool-calling copilots, MCP servers, and ReAct agents.</text>

  <!-- spec card -->
  <g class="mono">
    <rect x="1480" y="140" width="360" height="140" rx="6" fill="#0b0c12" stroke="#ff2d4f" stroke-width="1.4"/>
    <circle cx="1506" cy="168" r="5" fill="#ff2d4f"/>
    <text x="1522" y="173" font-size="13" font-weight="800" letter-spacing="2.5" class="red">SKILL BUNDLE</text>
    <line x1="1504" y1="190" x2="1816" y2="190" stroke="#2a2c3a"/>
    <text x="1504" y="215" font-size="11" letter-spacing="2" class="dim">CHANNEL</text>
    <text x="1816" y="215" text-anchor="end" font-size="12" class="white">Claude Code / skills</text>
    <text x="1504" y="239" font-size="11" letter-spacing="2" class="dim">AUTHOR</text>
    <text x="1816" y="239" text-anchor="end" font-size="12" class="white">Sachin Sharma</text>
    <text x="1504" y="263" font-size="11" letter-spacing="2" class="dim">UPDATED</text>
    <text x="1816" y="263" text-anchor="end" font-size="12" class="white">2026-10 - MIT</text>
  </g>

  <!-- what's inside -->
  <g class="mono" transform="translate(80 446)">
    <text x="0" y="0" font-size="11" letter-spacing="3" font-weight="800" class="dim">WHAT'S INSIDE</text>
    <line x1="170" y1="-4" x2="1760" y2="-4" stroke="#1d1f2b"/>
    <g font-size="13">
      <text x="0" y="40" class="red" font-weight="800">&gt;</text>
      <text x="24" y="40" class="white" font-weight="800" letter-spacing="1.5">FOUR DETECTION ARMS</text>
      <text x="24" y="60" class="muted">taint · unrequested action · output echo · provenance</text>

      <text x="600" y="40" class="red" font-weight="800">&gt;</text>
      <text x="624" y="40" class="white" font-weight="800" letter-spacing="1.5">FP + NEGATIVE-RESULT GATES</text>
      <text x="624" y="60" class="muted">generated text != retrieved state — in every skill</text>

      <text x="1200" y="40" class="red" font-weight="800">&gt;</text>
      <text x="1224" y="40" class="white" font-weight="800" letter-spacing="1.5">14-GATE VALIDATION LAB</text>
      <text x="1224" y="60" class="muted">no model, no API key — re-runnable</text>

      <text x="0" y="96" class="red" font-weight="800">&gt;</text>
      <text x="24" y="96" class="white" font-weight="800" letter-spacing="1.5">CHARACTERIZE-FIRST</text>
      <text x="24" y="116" class="muted">visibility · allowlist · egress · oracle · auth</text>

      <text x="600" y="96" class="red" font-weight="800">&gt;</text>
      <text x="624" y="96" class="white" font-weight="800" letter-spacing="1.5">SELF-CONTAINED PROBES</text>
      <text x="624" y="116" class="muted">stdlib-only, each ends in # LETHAL WHEN:</text>

      <text x="1200" y="96" class="red" font-weight="800">&gt;</text>
      <text x="1224" y="96" class="white" font-weight="800" letter-spacing="1.5">FIELD-VALIDATED</text>
      <text x="1224" y="116" class="muted">AgentDojo · DVMCP · DVLA · InjecAgent · CTF</text>
    </g>
  </g>

  <!-- stats band -->
  <g transform="translate(80 592)">
    <line x1="0" y1="0" x2="1760" y2="0" stroke="#2a2c3a"/>
    <line x1="842" y1="0" x2="918" y2="0" stroke="#ff2d4f" stroke-width="3"/>
    <g class="sans" font-weight="800" text-anchor="middle">
      <text x="147" y="66" font-size="52" class="red">24</text>
      <text x="440" y="66" font-size="52" class="red">23</text>
      <text x="733" y="66" font-size="52" class="red">14</text>
      <text x="1027" y="66" font-size="52" class="cyan">4</text>
      <text x="1320" y="66" font-size="52" class="amber">949</text>
      <text x="1613" y="66" font-size="52" class="white">0</text>
    </g>
    <g class="mono" font-size="11" font-weight="800" letter-spacing="3" text-anchor="middle">
      <text x="147" y="100" class="muted">SKILLS</text>
      <text x="440" y="100" class="muted">RUNNABLE PROBES</text>
      <text x="733" y="100" class="muted">LAB GATES · 7 ENVS</text>
      <text x="1027" y="100" class="muted">DETECTION ARMS</text>
      <text x="1320" y="100" class="muted">FIELD RUNS · FN 0</text>
      <text x="1613" y="100" class="muted">LAB FAILURES</text>
    </g>
  </g>

  <!-- terminal -->
  <g class="mono" transform="translate(80 700)">
    <rect x="0" y="0" width="1760" height="76" rx="6" fill="#0b0c12" stroke="#2a2c3a"/>
    <circle cx="24" cy="19" r="4" fill="#b81e37"/>
    <circle cx="40" cy="19" r="4" fill="#5f6070"/>
    <circle cx="56" cy="19" r="4" fill="#5f6070"/>
    <text x="84" y="23" font-size="11" letter-spacing="1.6" class="dim">agent skills session - ~/.claude/skills + ~/.config/opencode/skills + ~/.hermes/skills</text>
    <line x1="0" y1="34" x2="1760" y2="34" stroke="#202230"/>
    <text x="24" y="58" font-size="13" font-weight="800" class="red">&gt;</text>
    <text x="48" y="58" font-size="13" class="white">python3 lab/run_lab.py</text>
    <text x="300" y="58" font-size="12" class="dim"># 14/14 exploit gates - no model, no API key, re-runnable</text>
    <text x="1736" y="58" font-size="12" text-anchor="end" class="red" font-weight="800">SHIP WITH DISCIPLINE</text>
  </g>
</svg>
