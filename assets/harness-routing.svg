<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Claude-AgentHunter harness routing card — five agent harnesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#0b1117"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#202230" stroke-width="0.8" opacity="0.5"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,"JetBrains Mono","IBM Plex Mono","SF Mono",Menlo,monospace}
      .white{fill:#f7f7fb}.muted{fill:#a5a6b4}.dim{fill:#636475}.red{fill:#ff2d4f}
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g transform="translate(20 20)">
    <rect x="0" y="0" width="1160" height="260" rx="8" fill="#0b0c12" stroke="#2a2c3a"/>
    <text x="28" y="40" class="mono dim" font-size="12" font-weight="800" letter-spacing="2.2">HARNESS ROUTING</text>
    <line x1="180" y1="36" x2="1132" y2="36" stroke="#1d1f2b"/>

    <!-- box 1 : Claude Code -->
    <g transform="translate(28 60)">
      <rect width="210" height="120" rx="6" fill="#12131c" stroke="#D97757"/>
      <g transform="translate(16 16)" fill="#D97757"><path d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/></g>
      <text x="50" y="34" class="mono white" font-size="12.5" font-weight="800">Claude Code</text>
      <line x1="18" y1="66" x2="192" y2="66" stroke="#23242f"/>
      <text x="18" y="96" class="mono muted" font-size="11">~/.claude/skills</text>
    </g>
    <!-- box 2 : OpenCode -->
    <g transform="translate(255.5 60)">
      <rect width="210" height="120" rx="6" fill="#12131c" stroke="#9aa0ae"/>
      <g transform="translate(16 16)" fill="#e8e8ee"><path d="M16 6H8v12h8V6zm4 16H4V2h16v20z"/></g>
      <text x="50" y="34" class="mono white" font-size="12.5" font-weight="800">OpenCode</text>
      <line x1="18" y1="66" x2="192" y2="66" stroke="#23242f"/>
      <text x="18" y="96" class="mono muted" font-size="11">~/.agents/skills</text>
    </g>
    <!-- box 3 : Codex CLI -->
    <g transform="translate(483 60)">
      <rect width="210" height="120" rx="6" fill="#12131c" stroke="#4cc9f0"/>
      <g transform="translate(16 16)" fill="#e8e8ee"><path d="M8.086.457a6.105 6.105 0 013.046-.415c1.333.153 2.521.72 3.564 1.7a.117.117 0 00.107.029c1.408-.346 2.762-.224 4.061.366l.063.03.154.076c1.357.703 2.33 1.77 2.918 3.198.278.679.418 1.388.421 2.126a5.655 5.655 0 01-.18 1.631.167.167 0 00.04.155 5.982 5.982 0 011.578 2.891c.385 1.901-.01 3.615-1.183 5.14l-.182.22a6.063 6.063 0 01-2.934 1.851.162.162 0 00-.108.102c-.255.736-.511 1.364-.987 1.992-1.199 1.582-2.962 2.462-4.948 2.451-1.583-.008-2.986-.587-4.21-1.736a.145.145 0 00-.14-.032c-.518.167-1.04.191-1.604.185a5.924 5.924 0 01-2.595-.622 6.058 6.058 0 01-2.146-1.781c-.203-.269-.404-.522-.551-.821a7.74 7.74 0 01-.495-1.283 6.11 6.11 0 01-.017-3.064.166.166 0 00.008-.074.115.115 0 00-.037-.064 5.958 5.958 0 01-1.38-2.202 5.196 5.196 0 01-.333-1.589 6.915 6.915 0 01.188-2.132c.45-1.484 1.309-2.648 2.577-3.493.282-.188.55-.334.802-.438.286-.12.573-.22.861-.304a.129.129 0 00.087-.087A6.016 6.016 0 015.635 2.31C6.315 1.464 7.132.846 8.086.457zm-.804 7.85a.848.848 0 00-1.473.842l1.694 2.965-1.688 2.848a.849.849 0 001.46.864l1.94-3.272a.849.849 0 00.007-.854l-1.94-3.393zm5.446 6.24a.849.849 0 000 1.695h4.848a.849.849 0 000-1.696h-4.848z"/></g>
      <text x="50" y="34" class="mono white" font-size="12.5" font-weight="800">Codex CLI</text>
      <line x1="18" y1="66" x2="192" y2="66" stroke="#23242f"/>
      <text x="18" y="96" class="mono muted" font-size="11">~/.agents/skills</text>
    </g>
    <!-- box 4 : Hermes Agent -->
    <g transform="translate(710.5 60)">
      <rect width="210" height="120" rx="6" fill="#12131c" stroke="#f6b44b"/>
      <circle cx="28" cy="28" r="11" fill="none" stroke="#f6b44b" stroke-width="2"/>
      <path d="M22 28 h12 M28 22 v12" stroke="#f6b44b" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="34" class="mono white" font-size="12.5" font-weight="800">Hermes Agent</text>
      <line x1="18" y1="66" x2="192" y2="66" stroke="#23242f"/>
      <text x="18" y="96" class="mono muted" font-size="11">~/.hermes/skills</text>
    </g>
    <!-- box 5 : AntiGravity -->
    <g transform="translate(938 60)">
      <rect width="210" height="120" rx="6" fill="#12131c" stroke="#a78bfa"/>
      <path d="M28 16 L31 25 L40 28 L31 31 L28 40 L25 31 L16 28 L25 25 Z" fill="#a78bfa"/>
      <text x="50" y="34" class="mono white" font-size="12.5" font-weight="800">AntiGravity</text>
      <line x1="18" y1="66" x2="192" y2="66" stroke="#23242f"/>
      <text x="18" y="96" class="mono muted" font-size="11">~/.gemini/config/skills</text>
    </g>

    <text x="28" y="228" class="mono" font-size="14"><tspan class="red" font-weight="800">$ </tspan><tspan class="white">bash scripts/install.sh --all</tspan></text>
    <text x="1132" y="228" text-anchor="end" class="mono dim" font-size="12" letter-spacing="1.2">ONE COMMAND · FIVE HARNESSES</text>
  </g>
</svg>
